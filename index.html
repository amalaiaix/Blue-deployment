<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Deployment</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0078D7;
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 15%;
        }

        h1 {
            font-size: 60px;
        }

        p {
            font-size: 24px;
        }

        .box {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            width: 60%;
            margin: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>BLUE DEPLOYMENT</h1>
            <p>Application Version: V1</p>
            <p>Container Image: amalaiaix/nginx-custom:v1</p>
            <p>Status: Running Successfully</p>
        </div>
    </div>

</html>
